name: Documentation reading map
on:
  push:
    branches: [main, dev]
    paths:
      - '**/*.md'
      - 'scripts/check-doc-map.mjs'
      - '.github/workflows/docs-map.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-doc-map.mjs'
      - '.github/workflows/docs-map.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-doc-map.mjs
